<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, and information about our rafting adventures.">
    <meta name="author" content="Henok Markos">

    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <div>
                <h2>Contact Information</h2>
                <p>White Water Rafting</p>
                <p>bonga,kaffa,dadiben falls</p>
                <p>Phone: +251930474808</p>
                <p>Email: nokaye77@gmail.com</p>
            </div>

            <div>
                <iframe src="https://www.google.com/maps?q=Addis%20Ababa%2C%20Ethiopia&output=embed"
                  width="300" height="200" title="White Water Rafting location map">
                </iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Rafting guide">
                    <figcaption>Yihune Girma — River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Rafting manager">
                    <figcaption>Sarah Haile — Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer service employee">
                    <figcaption>Eyasu Markos — Customer Service</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>What is the purpose of your message?</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>


    <footer>

        <p>&copy; 2026 White Water Rafting | Henok Markos</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook social media">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram social media">
            </a>

            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="YouTube social media">
            </a>

        </nav>

    </footer>

</body>

</html>
