<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An HTML and CSS quiz for WDD 130.">
    <meta name="author" content="Henok Markos">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>

    <main>
        <h1>HTML and CSS Quiz</h1>
        <form>
            <label for="q1">1. What does HTML stand for?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. What is CSS used for?</label>
            <textarea id="q2" name="q2"></textarea>

            <label for="q3">3. Which HTML tag is used to create a paragraph?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="p">p</option>
                <option value="h1">h1</option>
                <option value="div">div</option>
            </select>


            <label for="q4">4. How many heading levels are available in HTML?</label>
            <input type="number" id="q4" name="q4">

            <button type="submit">Submit Quiz</button>
        </form>

    </main>

</body>

</html>
